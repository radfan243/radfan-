<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLDAN AI — السجلات</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">G</span><span><b>GOLDAN AI</b><small>AI SMART TRADING</small></span></a><nav class="nav-links"><a class="nav-link" href="index.html">التداول</a><a class="nav-link" href="index.html#analysis">التحليل</a><a class="nav-link" href="reading.html">القراءة</a><a class="nav-link active" href="records.html">السجلات</a><a class="nav-link" href="settings.html">الإعدادات</a></nav></header><main class="shell"><section class="hero"><div><span class="eyebrow">LOCAL RECORDS</span><h1>سجل التحليلات<br><em>على جهازك.</em></h1><p>يحفظ آخر الإشارات التي تختار تسجيلها محليًا داخل المتصفح فقط.</p></div></section><section class="main-panel"><div class="panel-head"><div><span class="eyebrow">HISTORY</span><h2>السجل</h2></div><button class="icon-btn" id="clear">حذف</button></div><div id="list" class="coin-list" style="margin-top:18px"></div><div class="disclaimer">السجلات محلية في هذا المتصفح ولا تُرسل إلى خادم من هذه الصفحة.</div></section></main><footer>GOLDAN AI · Local records</footer><script>const key='goldanRecords';const list=document.getElementById('list');function render(){const a=JSON.parse(localStorage.getItem(key)||'[]');list.innerHTML=a.length?a.map(x=>`<div class="coin"><div><strong>${x.symbol||'—'} · ${x.signal||'—'}</strong><small>${x.time||''}</small></div><div class="coin-price">${x.price||'—'}</div></div>`).join(''):'<p class="mini-note">لا توجد سجلات محفوظة بعد.</p>'}document.getElementById('clear').onclick=()=>{localStorage.removeItem(key);render()};render();</script></body></html>
